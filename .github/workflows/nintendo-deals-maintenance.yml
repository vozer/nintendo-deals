name: Nintendo Deals Maintenance

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Snapshot to refresh
        required: true
        type: choice
        options:
          - ntdeals
          - steam
          - media
      dry_run:
        description: Read and calculate only; do not publish a snapshot
        required: true
        default: true
        type: boolean
      game_id:
        description: Optional Nintendo ID for a focused Steam/media repair
        type: string
      limit:
        description: Maximum games for Steam/media (1-100)
        default: '25'
        type: string
      refresh_incomplete:
        description: Revisit incomplete or legacy media entries
        default: false
        type: boolean

concurrency:
  group: nintendo-deals-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'

      - name: Install NT Deals parser dependency
        if: inputs.operation == 'ntdeals'
        run: python -m pip install -r automation/requirements.txt

      - name: Refresh selected snapshot
        env:
          OPERATION: ${{ inputs.operation }}
          DRY_RUN: ${{ inputs.dry_run }}
          GAME_ID: ${{ inputs.game_id }}
          LIMIT: ${{ inputs.limit }}
          REFRESH_INCOMPLETE: ${{ inputs.refresh_incomplete }}
          NINTENDO_DEALS_BASE_URL: ${{ vars.NINTENDO_DEALS_BASE_URL }}
          RATINGS_API_KEY: ${{ secrets.RATINGS_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          : "${NINTENDO_DEALS_BASE_URL:?NINTENDO_DEALS_BASE_URL repository variable is required}"
          script=""
          case "$OPERATION" in
            ntdeals) script="scripts/scrape-ntdeals.py" ;;
            steam) script="scripts/steam-backfill.py" ;;
            media) script="scripts/media-backfill.py" ;;
            *) echo "Unsupported maintenance operation" >&2; exit 2 ;;
          esac
          args=(--base-url "$NINTENDO_DEALS_BASE_URL")
          if [[ "$OPERATION" == "steam" || "$OPERATION" == "media" ]]; then
            args+=(--limit "$LIMIT")
            if [[ -n "$GAME_ID" ]]; then args+=(--game-id "$GAME_ID"); fi
          fi
          if [[ "$OPERATION" == "media" && "$REFRESH_INCOMPLETE" == "true" ]]; then args+=(--refresh-incomplete); fi
          if [[ "$DRY_RUN" != "true" ]]; then
            : "${RATINGS_API_KEY:?RATINGS_API_KEY secret is required to publish}"
            args+=(--apply)
          fi
          python "$script" "${args[@]}"
