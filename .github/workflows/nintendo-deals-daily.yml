name: Nintendo Deals Daily

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Fetch and calculate only; do not publish source snapshots, ratings, or Telegram messages
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '7 10 * * *'
      timezone: Europe/Madrid

concurrency:
  group: nintendo-deals-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare run evidence directory
        run: mkdir -p run-evidence/catalog-pages

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'

      - name: Select run mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            echo "dry_run=1" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh Nintendo Life eShop Selects
        id: curation
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          NINTENDO_DEALS_BASE_URL: ${{ vars.NINTENDO_DEALS_BASE_URL }}
          RATINGS_API_KEY: ${{ secrets.RATINGS_API_KEY }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
          NINTENDO_DEALS_CURATION_SUMMARY_PATH: run-evidence/curated-run-summary.json
          NINTENDO_DEALS_CURATION_EVIDENCE_PATH: run-evidence/curation-evidence.json
          NINTENDO_DEALS_CURATION_SOURCE_PATH: run-evidence/nintendolife-source.html.gz
        shell: bash
        run: |
          if [[ "$DRY_RUN" == "1" ]]; then
            python scripts/scrape-curated.py
          else
            : "${NINTENDO_DEALS_BASE_URL:?NINTENDO_DEALS_BASE_URL repository variable is required for publishing}"
            python scripts/scrape-curated.py --base-url "$NINTENDO_DEALS_BASE_URL" --apply
          fi

      - name: Run daily worker
        id: worker
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
        env:
          NINTENDO_DEALS_BASE_URL: ${{ vars.NINTENDO_DEALS_BASE_URL }}
          RATINGS_API_KEY: ${{ secrets.RATINGS_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
          NINTENDO_DEALS_SUMMARY_PATH: run-evidence/daily-run-summary.json
          NINTENDO_DEALS_EVIDENCE_PATH: run-evidence/daily-run-evidence.json
          NINTENDO_DEALS_CATALOG_EVIDENCE_PATH: run-evidence/active-catalog.json.gz
          NINTENDO_DEALS_CATALOG_PAGES_DIR: run-evidence/catalog-pages
          NINTENDO_DEALS_PRIVATE_EVIDENCE_PATH: run-evidence/private-run-inputs.json.gz
        run: python -m automation.run_daily

      - name: Finalize run evidence
        if: always()
        env:
          CURATION_OUTCOME: ${{ steps.curation.outcome }}
          WORKER_OUTCOME: ${{ steps.worker.outcome }}
          NINTENDO_DEALS_EVIDENCE_DIR: run-evidence
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_STARTED_AT: ${{ github.run_started_at }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE_URL: ${{ vars.NINTENDO_DEALS_BASE_URL }}
          RATINGS_API_KEY: ${{ secrets.RATINGS_API_KEY }}
        run: python scripts/finalize-daily-run.py

      - name: Upload detailed redacted run evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nintendo-deals-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            run-evidence/active-catalog.json.gz
            run-evidence/catalog-pages/page-*.json.gz
            run-evidence/curated-run-summary.json
            run-evidence/curation-evidence.json
            run-evidence/daily-run-evidence.json
            run-evidence/daily-run-summary.json
            run-evidence/nintendolife-source.html.gz
            run-evidence/redacted-summary.json
            run-evidence/workflow-run.json
          if-no-files-found: error
          retention-days: 90
